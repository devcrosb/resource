<div class="expandable-text">
  <div class="text-content" id="description">
    This is some variable-length text. It might be short, or it might be
    extremely long. By default only a few lines are displayed, but the user
    can expand it if they want to read everything...
  </div>

  <button
    class="toggle-button"
    type="button"
    aria-expanded="false"
    aria-controls="description"
  >
    Show more
  </button>
</div>
